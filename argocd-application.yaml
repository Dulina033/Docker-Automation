apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: docker-automation
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Dulina033/Docker-Automation.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true