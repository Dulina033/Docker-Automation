apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker-automation
  namespace: default
  labels:
    app: docker-automation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: docker-automation
  template:
    metadata:
      labels:
        app: docker-automation
    spec:
      containers:
      - name: docker-automation
        image: dulina/docker-automation:latest
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: docker-automation
  namespace: default
spec:
  selector:
    app: docker-automation
  ports:
  - port: 80
    targetPort: 3000
  type: LoadBalancer